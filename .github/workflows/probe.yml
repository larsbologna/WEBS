name: Fotos candidatas (temporal)

on:
  push:
    branches-ignore: [main]
    paths: ['scripts/probe-ids.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-ids.mjs
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add scripts/probe
          git commit -m "Fotos candidatas"
          git push
