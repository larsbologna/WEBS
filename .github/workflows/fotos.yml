name: Fotos

# Comprueba que todas las fotos del sitio carguen. Corre en cada cambio y en cada PR;
# la publicación (deploy.yml) también la ejecuta y se cancela si alguna falla.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-photos.mjs
  # Temporal: baja fotos candidatas para elegir y las sube a la rama.
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test -f scripts/photo-queries.json && node scripts/fetch-candidates.mjs || echo "nada que buscar"
      - run: |
          if [ -n "$(git status --porcelain scripts/candidates)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add scripts/candidates
            git commit -m "Fotos candidatas"
            git push
          fi
